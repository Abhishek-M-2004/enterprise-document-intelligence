# Production Reverse Proxy Configuration for Multi-Tenant Enterprise Document Intelligence Platform

upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot Challenge Location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. API Reverse Proxy with Streaming & Extended Timeouts
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow long-running operations (BGE reranking, LLM calls, evaluation runs)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Upload Buffer Settings
        client_max_body_size 50M;
        proxy_request_buffering off;
    }

    # 2. Server-Sent Events (SSE) Route for Real-Time AI Chat Streaming
    location /api/v1/chat/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR SSE: Disable buffering so tokens stream token-by-token
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Prevent connection drops during model thinking
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. Static Documentation / OpenAPI Specs
    location ~* ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Frontend SPA Delivery
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
