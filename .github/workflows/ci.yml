name: CI/CD Pipeline - Enterprise Document Intelligence Platform

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing & Security Auditing
  # ============================================================================
  backend-test:
    name: Backend Test Suite & RLS Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: doc_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/readyz || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev curl

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Bootstrap Database Roles & Execute Alembic Migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: doc_intelligence
          SYNC_DATABASE_URL_OVERRIDE: postgresql+psycopg2://postgres:devpassword@localhost:5432/doc_intelligence
        run: |
          # 1. Execute Alembic schema migrations
          cd backend
          alembic upgrade head
          
          # 2. Provision dedicated non-superuser docintel_app role
          psql "postgresql://postgres:devpassword@localhost:5432/doc_intelligence" -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'docintel_app') THEN
                CREATE ROLE docintel_app WITH LOGIN PASSWORD 'docintel_secure_pass_2026' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rls_app_user') THEN
                CREATE ROLE rls_app_user WITH NOSUPERUSER NOBYPASSRLS;
              END IF;
            END \$\$;
            GRANT CONNECT ON DATABASE doc_intelligence TO docintel_app;
            GRANT USAGE ON SCHEMA public TO docintel_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO docintel_app;
            GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO docintel_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO docintel_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO docintel_app;
            GRANT rls_app_user TO docintel_app;
          "

      - name: Run Backend Regression & Security Test Suite (95 Tests)
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: docintel_app
          POSTGRES_PASSWORD: docintel_secure_pass_2026
          POSTGRES_DB: doc_intelligence
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          SECRET_KEY: ci-test-secret-key-replace-in-production-min-32-chars
          ENVIRONMENT: test
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v

  # ============================================================================
  # 2. Frontend Build & Quality Checks
  # ============================================================================
  frontend-build:
    name: Frontend Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        run: npm run build

      - name: Verify Dist Artifact Generation
        working-directory: ./frontend
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          ls -lh dist/assets/

  # ============================================================================
  # 3. Production Docker Build Verification
  # ============================================================================
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: docintel-backend:ci-test

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: docintel-frontend:ci-test

  # ============================================================================
  # 4. Continuous Deployment (CD) Staging / Host Trigger
  # ============================================================================
  deploy:
    name: Production Deployment (Cloud VPS)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verify Deployment Secrets Configured
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_SSH_HOST }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Notice: Deployment credentials not configured. Skipping automated remote deployment."
          fi

      - name: Deploy to Cloud Host via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/doc_intelligence
            git pull origin main
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
